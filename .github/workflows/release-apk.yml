name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（留空默认 v<package.json#version>）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: 构建并发布 Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.5"

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full verification gate
        run: bun run verify:all

      - name: Resolve and validate release version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$EVENT_NAME" = "push" ]; then
            TAG_NAME="$REF_NAME"
            if [ "$TAG_NAME" != "v${PKG_VERSION}" ]; then
              echo "错误：标签 ${TAG_NAME} 与 package.json 版本 v${PKG_VERSION} 不一致。"
              exit 1
            fi
          else
            if [ -n "$INPUT_TAG" ]; then
              TAG_NAME="$INPUT_TAG"
            else
              TAG_NAME="v${PKG_VERSION}"
            fi
          fi
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install required Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            echo "未检测到 ANDROID_HOME"
            exit 1
          fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" || \
            "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"

      - name: Prepare Android signing keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/zerovault-release.keystore
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            echo "signed_mode=release" >> "$GITHUB_OUTPUT"
            echo "store_file=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"
          else
            echo "signed_mode=debug-fallback" >> "$GITHUB_OUTPUT"
            echo "store_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android Release APK
        env:
          ZEROVAULT_RELEASE_STORE_FILE: ${{ steps.signing.outputs.store_file }}
          ZEROVAULT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZEROVAULT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZEROVAULT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Clean up temporary keystore
        if: always()
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/zerovault-release.keystore
        run: |
          if [ -f "$KEYSTORE_PATH" ]; then
            rm -f "$KEYSTORE_PATH"
          fi

      - name: Package release artifacts and checksums
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          SIGNED_MODE: ${{ steps.signing.outputs.signed_mode }}
        run: |
          mkdir -p release-assets
          APK_NAME="ZeroVault-${RELEASE_TAG}-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/${APK_NAME}"
          (cd release-assets && sha256sum "${APK_NAME}" > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        env:
          PKG_VERSION: ${{ steps.meta.outputs.version }}
          SIGNED_MODE: ${{ steps.signing.outputs.signed_mode }}
        run: |
          node -e '
            const fs = require("fs");
            const ver = process.env.PKG_VERSION;
            const text = fs.readFileSync("CHANGELOG.md", "utf8");
            const escaped = ver.replace(/\./g, "\\.");
            const re = new RegExp(`## \\[${escaped}\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\[|$)`);
            const m = text.match(re);
            let notes = m ? m[1].trim() : `ZeroVault v${ver} Android 发布版本。`;
            if (process.env.SIGNED_MODE !== "release") {
              notes += "\n\n> **签名说明**：当前仓库尚未配置正式签名 Secrets，本安装包使用项目开发签名构建，可直接安装体验；配置 `ANDROID_KEYSTORE_*` Secrets 后将自动切换正式签名。";
            }
            notes += "\n\n### 校验文件\n下载后可使用附带的 `SHA256SUMS.txt` 校验 APK 完整性。";
            fs.writeFileSync("release-assets/RELEASE_NOTES.md", notes + "\n", "utf8");
          '

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          APK_FILE="release-assets/ZeroVault-${RELEASE_TAG}-android.apk"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_FILE" release-assets/SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-assets/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" \
              "$APK_FILE" \
              release-assets/SHA256SUMS.txt \
              --title "ZeroVault ${RELEASE_TAG}" \
              --notes-file release-assets/RELEASE_NOTES.md
          fi
