      <path fill="#113A4D" d="M54,30.2 L71.4,37.5 L71.4,53.2 C71.4,64.8 63.6,73.7 54,77.7 C44.4,73.7 36.6,64.8 36.6,53.2 L36.6,37.5 Z" />
      <path fill="#5CC3DF" d="M43.5,42.5 L64.5,42.5 L64.5,47.5 L51.4,60.5 L64.5,60.5 L64.5,65.5 L43.5,65.5 L43.5,60.5 L56.6,47.5 L43.5,47.5 Z" />
      <circle cx="54" cy="54" r="2.8" fill="#F4FAFC" />
