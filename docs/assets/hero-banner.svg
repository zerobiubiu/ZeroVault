  </defs>

  <!-- 圆角主画布 -->
  <rect x="8" y="8" width="1184" height="324" rx="24" fill="url(#bgGrad)" stroke="#2A6D87" stroke-width="1.5" />
  <rect x="8" y="8" width="1184" height="324" rx="24" fill="url(#glow)" />

