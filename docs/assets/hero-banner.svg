  <circle cx="1050" cy="170" r="118" fill="none" stroke="#5CC3DF" stroke-opacity="0.08" stroke-width="1.5" />
  <circle cx="1050" cy="170" r="84" fill="none" stroke="#5CC3DF" stroke-opacity="0.1" stroke-width="1" />
  <circle cx="1050" cy="170" r="50" fill="none" stroke="#5CC3DF" stroke-opacity="0.12" stroke-width="1" />

