<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="ZeroVault - Android KDBX Password Manager">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E2B" />
      <stop offset="55%" stop-color="#123A4E" />
      <stop offset="100%" stop-color="#1B5D76" />
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5CC3DF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0B1E2B" stop-opacity="0" />
