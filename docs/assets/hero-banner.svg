    <circle cx="84" cy="84" r="62" fill="none" stroke="#A8D8EA" stroke-opacity="0.22" stroke-width="1.5" />
    <circle cx="84" cy="84" r="48" fill="none" stroke="#A8D8EA" stroke-opacity="0.16" stroke-width="1.2" />
    <g transform="scale(1.5556)">
